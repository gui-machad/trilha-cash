<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha do Cash</title>
<meta name="description" content="Escola de poker de cash: jogue mãos completas com correção, lições, exercícios e cartões.">
<meta name="theme-color" content="#13604A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilha do Cash">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: uma coluna estreita com abas (Hoje · Trilha · Cartões); o treino ocupa a tela com cartas no feltro e botões grandes. */
:root{
  --bg:#EEF0EA; --surface:#FFFFFF; --surface-2:#F3F5EF; --ink:#18201B; --muted:#5E6A61; --line:#D5DCD3;
  --felt:#13604A; --felt-2:#0B3F30; --felt-ink:#E6F1EB; --felt-muted:#A3C8B6;
  --gold:#C8901A; --gold-soft:#F7EBCF; --accent:#0C7A55; --accent-soft:#D6ECE1;
  --good:#17824A; --good-soft:#DCF0E3; --bad:#C0303D; --bad-soft:#F7DDDF;
  --raise:#1E9457; --call:#E2AE2C; --check:#3B7DD8; --fold:#C9343F;
  --card:#FDFEFD; --card-line:#C5D0CA;
  --s0:#1A1F1C; --s1:#C8283C; --s2:#1E5DC0; --s3:#1B7A37;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B110E; --surface:#141D19; --surface-2:#1B2621; --ink:#E3ECE7; --muted:#97A99F; --line:#2A3832;
    --felt:#0F4A38; --felt-2:#082A1F; --felt-ink:#E3F0E9; --felt-muted:#86B29E;
    --gold:#E9B444; --gold-soft:#3A2D10; --accent:#3AC48D; --accent-soft:#143A2C;
    --good:#45C681; --good-soft:#12301F; --bad:#F06C77; --bad-soft:#3C171C;
    --card:#E4EAE6; --card-line:#8FA299;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B110E; --surface:#141D19; --surface-2:#1B2621; --ink:#E3ECE7; --muted:#97A99F; --line:#2A3832;
  --felt:#0F4A38; --felt-2:#082A1F; --felt-ink:#E3F0E9; --felt-muted:#86B29E;
  --gold:#E9B444; --gold-soft:#3A2D10; --accent:#3AC48D; --accent-soft:#143A2C;
  --good:#45C681; --good-soft:#12301F; --bad:#F06C77; --bad-soft:#3C171C;
  --card:#E4EAE6; --card-line:#8FA299;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-block:14px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--felt);display:grid;place-items:center;color:var(--gold);font-size:19px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.sync{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05}
h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.muted{color:var(--muted)}
.help{font-size:13px;color:var(--muted)}
/* Abas fixas embaixo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1.5px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:600px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px;color:var(--muted)}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
/* Hoje */
.level{display:flex;align-items:center;gap:14px}
.medal{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold) 0%,color-mix(in srgb,var(--gold) 60%,#000 40%) 100%);display:grid;place-items:center;color:#1F1600;font:700 22px var(--f-display);box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.lvname{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--gold)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat small{font-size:12px;color:var(--muted)}
.big{width:100%;min-height:60px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-size:18px;font-weight:700;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px}
.big small{font-weight:500;opacity:.75;font-size:14px}
.big.alt{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)}
.big.gold{background:var(--gold);color:#1F1600}
.weak{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.weak li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.weak li b{font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:42px;border-radius:10px;border:2px solid var(--line);background:var(--surface-2);font-weight:700;font-size:15px;padding:6px 12px}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:12px}
.setrow > span{font-weight:700;font-size:15px}
/* Trilha */
.mods{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.mod{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.mod .num{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-mono);background:var(--surface-2);border:2px solid var(--line)}
.mod.done .num{background:var(--gold);border-color:var(--gold);color:#1F1600}
.mod.next{border-color:var(--ink)}
.mod .tt{font-weight:700;font-size:17px;line-height:1.2}
.mod .st{font-size:13px;color:var(--muted)}
.mod .pc{margin-left:auto;font-family:var(--f-mono);font-weight:700;font-size:15px}
.stage{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
/* Lição */
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;font-size:15px}
.lesson h4{font-size:17px;margin:16px 0 6px}
.lesson p{margin:8px 0}
.lesson ul{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.lesson table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.lesson td,.lesson th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
.lesson th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lesson td b{font-family:var(--f-mono)}
.decore{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin:14px 0}
.decore b:first-child{display:block;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin-bottom:4px}
.ex{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:12px 0}
.tablewrap{overflow-x:auto}
/* Treino */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .prog{margin-left:auto;font-family:var(--f-mono);font-weight:700}
.dots{display:flex;gap:4px;margin-top:10px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.bad{background:var(--bad);border-color:var(--bad)}
.dots i.cur{background:var(--gold);border-color:var(--gold)}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:14px}
.felt{margin-top:10px;border-radius:14px;padding:10px 12px;background:radial-gradient(120% 140% at 0% 0%,var(--felt) 0%,var(--felt-2) 100%);display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:6px}
.frow .lb{width:52px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--felt-muted)}
.pc{width:50px;aspect-ratio:5/7;border-radius:7px;background:var(--card);border:1px solid var(--card-line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pc.sm{width:44px}
.pc b{font-family:var(--f-display);font-weight:700;font-size:23px}
.pc i{font-style:normal;font-size:18px;margin-top:1px}
.mini{display:inline-flex;gap:3px;flex-wrap:wrap}
.mc{width:24px;aspect-ratio:5/7;border-radius:4px;background:var(--card);border:1px solid var(--card-line);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mc b{font-family:var(--f-display);font-weight:700;font-size:13px}
.mc i{font-style:normal;font-size:9px}
.s0{color:var(--s0)}.s1{color:var(--s1)}.s2{color:var(--s2)}.s3{color:var(--s3)}
.qtext{font-size:20px;font-weight:700;line-height:1.3;margin:14px 0 10px}
.timer{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.timer span{display:block;height:100%;background:var(--accent);transition:width .1s linear}
.timer span.low{background:var(--fold)}
.tleft{font:700 13px var(--f-mono);text-align:right;color:var(--muted);margin:4px 0 8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.one{grid-template-columns:1fr}
.opt{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-size:17px;font-weight:700;padding:8px;line-height:1.2;overflow-wrap:anywhere}
.opt.act{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.opt.a-fold{border-color:var(--fold);color:var(--fold)}
.opt.a-call{border-color:var(--call);color:color-mix(in srgb,var(--call) 70%,var(--ink) 30%)}
.opt.a-raise{border-color:var(--raise);color:var(--raise)}
.opt.a-check{border-color:var(--check);color:var(--check)}
.opt.right{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.4}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb > b{font-size:18px}
.fb p{margin:8px 0 0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:14px;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.range-wrap{overflow-x:auto;margin-top:6px}
.range{display:grid;grid-template-columns:repeat(13,minmax(22px,1fr));gap:2px;min-width:300px}
.rc{aspect-ratio:1;display:grid;place-items:center;font-family:var(--f-mono);font-size:clamp(8px,2vw,11px);border-radius:3px}
.rc.raise{background:var(--raise);color:#fff}
.rc.call{background:var(--call);color:#241900}
.rc.fold{background:var(--bad-soft);color:var(--bad)}
.rc.me{outline:3px solid var(--ink);outline-offset:-1px;font-weight:700;position:relative;z-index:1}
.summary{text-align:center}
.summary .score{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1}
/* Cartões */
.flash{min-height:220px;border-radius:18px;background:radial-gradient(120% 140% at 0% 0%,var(--felt) 0%,var(--felt-2) 100%);color:var(--felt-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;margin-top:12px}
.flash .front{font-size:22px;font-weight:700;line-height:1.3}
.flash .backtxt{margin-top:14px;font-size:20px;color:var(--gold);font-weight:700;line-height:1.35}
.flash .topic{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--felt-muted);margin-bottom:10px}
.boxes{display:flex;gap:6px;margin-top:10px}
.boxes div{flex:1;text-align:center;background:var(--surface-2);border-radius:10px;padding:6px 2px}
.boxes b{display:block;font-family:var(--f-mono);font-size:18px}
.boxes small{font-size:11px;color:var(--muted)}
.cardlist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.cardlist li{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.cardlist li b{color:var(--accent)}
@media (max-width:380px){.pc{width:44px}.pc.sm{width:40px}.opt.act{font-size:21px}.qtext{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Jogar mãos */
.pc.back{background:repeating-linear-gradient(45deg,#7A2E2E 0 6px,#923838 6px 12px);border-color:#5A1F1F}
.potc{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--felt-muted);line-height:1.1}
.potc b{font-family:var(--f-mono);font-size:16px;color:var(--felt-ink)}
.hlog{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.hlog li{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--line)}
.hlog li.vil{border-left-color:#7A4FD0}
.hlog li.hero{border-left-color:var(--gold)}
.hlog li.board{border-left-color:var(--accent);font-weight:700}
.hopt{font-size:16px}
.rinfo{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.rinfo small{color:var(--muted);font-size:12px}
.rbar{display:grid;grid-template-columns:150px minmax(0,1fr) 42px;align-items:center;gap:8px;font-size:13px}
.rbar i{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;display:block}
.rbar em{display:block;height:100%;background:#7A4FD0}
.rbar b{font-family:var(--f-mono);text-align:right}
.declist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.declist li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:14px}
.declist li.ok b{color:var(--good)}.declist li.bad b{color:var(--bad)}
.declist small{color:var(--muted);width:100%}
.hstats{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.hstats ul{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hstats li{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.hstats li b{font-family:var(--f-mono);font-size:20px}
.hstats li small{color:var(--muted);font-size:12px}
@media (max-width:380px){.rbar{grid-template-columns:120px minmax(0,1fr) 38px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo" aria-hidden="true">♠&#xFE0E;</span>
    <h1>Trilha do Cash</h1>
    <span class="sync" id="sync">salvo neste aparelho</span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Seções"><div class="in">
  <button type="button" data-act="tab" data-t="jogar"><span>♠&#xFE0E;</span>Jogar</button>
  <button type="button" data-act="tab" data-t="hoje"><span>☀︎</span>Hoje</button>
  <button type="button" data-act="tab" data-t="trilha"><span>⛰︎</span>Trilha</button>
  <button type="button" data-act="tab" data-t="cartoes"><span>🂠&#xFE0E;</span>Cartões</button>
</div></nav>

<script>
/* ================= Motor de mãos ================= */
const RANKS = "23456789TJQKA";
const rcnt = new Int8Array(13), scnt = new Int8Array(4), smask = new Int32Array(4);
function straightHigh(mask){
  for (let h = 12; h >= 4; h--){ const m = 0x1F << (h - 4); if ((mask & m) === m) return h; }
  if ((mask & 0x100F) === 0x100F) return 3;
  return -1;
}
function kickers(val, shift, count, a, b){
  for (let r = 12; r >= 0 && count > 0; r--){ if (rcnt[r] && r !== a && r !== b){ val |= (r + 1) << shift; shift -= 4; count--; } }
  return val;
}
function evalCards(cards, n){
  rcnt.fill(0); scnt.fill(0); smask.fill(0); let mask = 0;
  for (let i = 0; i < n; i++){ const c = cards[i], r = c >> 2, s = c & 3; rcnt[r]++; scnt[s]++; smask[s] |= 1 << r; mask |= 1 << r; }
  let fs = -1; for (let s = 0; s < 4; s++) if (scnt[s] >= 5){ fs = s; break; }
  if (fs >= 0){ const h = straightHigh(smask[fs]); if (h >= 0) return (8 << 20) | ((h + 1) << 16); }
  let quad = -1, t1 = -1, t2 = -1, p1 = -1, p2 = -1;
  for (let r = 12; r >= 0; r--){ const k = rcnt[r];
    if (k === 4){ if (quad < 0) quad = r; } else if (k === 3){ if (t1 < 0) t1 = r; else if (t2 < 0) t2 = r; } else if (k === 2){ if (p1 < 0) p1 = r; else if (p2 < 0) p2 = r; } }
  if (quad >= 0) return kickers((7 << 20) | ((quad + 1) << 16), 12, 1, quad, -1);
  if (t1 >= 0 && (t2 >= 0 || p1 >= 0)){ const pr = Math.max(t2, p1); return (6 << 20) | ((t1 + 1) << 16) | ((pr + 1) << 12); }
  if (fs >= 0){ let v = 5 << 20, sh = 16, cnt = 5; const fm = smask[fs]; for (let r = 12; r >= 0 && cnt > 0; r--) if (fm & (1 << r)){ v |= (r + 1) << sh; sh -= 4; cnt--; } return v; }
  const st = straightHigh(mask); if (st >= 0) return (4 << 20) | ((st + 1) << 16);
  if (t1 >= 0) return kickers((3 << 20) | ((t1 + 1) << 16), 12, 2, t1, -1);
  if (p1 >= 0 && p2 >= 0) return kickers((2 << 20) | ((p1 + 1) << 16) | ((p2 + 1) << 12), 8, 1, p1, p2);
  if (p1 >= 0) return kickers((1 << 20) | ((p1 + 1) << 16), 12, 3, p1, -1);
  return kickers(0, 16, 5, -1, -1);
}
function computeOuts(hero, board){
  const known = new Set([...hero, ...board]);
  const cur = evalCards([...hero, ...board], 2 + board.length) >> 20;
  const boardRanks = new Set(board.map(c => c >> 2)), list = [];
  for (let c = 0; c < 52; c++){
    if (known.has(c)) continue;

function isWet(b){
  const sc = [0, 0, 0, 0]; b.forEach(c => sc[c & 3]++);
  if (Math.max(...sc) >= 2) return true;
  const r = [...new Set(b.map(c => c >> 2))]; const ext = r.includes(12) ? [...r, -1] : r;
  for (let i = 0; i < ext.length; i++) for (let j = i + 1; j < ext.length; j++) if (Math.abs(ext[i] - ext[j]) <= 2) return true;
  return false;
}

function classify(a, b, board){
  const n = board.length, cards = [a, b, ...board];
  const s = evalCards(cards, 2 + n), cat = s >> 20, bcat = evalCards(board, n) >> 20;
  let top = 0; for (const c of board) top = Math.max(top, c >> 2);
  if (cat >= 2 && cat > bcat) return "monster";
  if (cat === 1 && bcat === 0){ const pr = ((s >> 16) & 15) - 1; return pr >= top ? "top" : "pair"; }
  if (n < 5){
    let fd = false;
    for (let su = 0; su < 4; su++){ let all = 0, bo = 0; for (const c of cards) if ((c & 3) === su) all++; for (const c of board) if ((c & 3) === su) bo++; if (all >= 4 && bo < 4 && ((a & 3) === su || (b & 3) === su)) fd = true; }
    let mask = 0, bmask = 0; for (const c of cards) mask |= 1 << (c >> 2); for (const c of board) bmask |= 1 << (c >> 2);
    let outs = 0, bouts = 0;
    for (let r = 0; r < 13; r++){ if (!((mask >> r) & 1) && straightHigh(mask | (1 << r)) >= 0) outs++; if (!((bmask >> r) & 1) && straightHigh(bmask | (1 << r)) >= 0) bouts++; }
    if (fd || outs - bouts >= 2) return "draw";
    if (outs - bouts === 1 || ((a >> 2) > top && (b >> 2) > top)) return "weak";
  }

}
const NARROW = {
  call:  { monster: 1, top: 1, pair: 0.9, draw: 0.9, weak: 0.35, air: 0.08 },
  bet:   { monster: 1, top: 0.9, pair: 0.5, draw: 0.6, weak: 0.3, air: 0.15 },
  raise: { monster: 1, top: 0.45, pair: 0.12, draw: 0.35, weak: 0.08, air: 0.03 },

function mkRange(base, n){ const v = { base, n, hist: [], w: null }; recalcR(v); return v; }
function recalcR(v){
  const set = baseSetH(v.base, v.n), w = new Float64Array(ALL_COMBOS.length);
  for (let i = 0; i < w.length; i++) w[i] = set.has(COMBO_CODE[i]) ? 1 : 0;
  for (const h of v.hist){
    const T = NARROW[h.t], dead = new Set(h.board);

    const w = v.w[i]; if (!w) continue; tot += w;
    const k = board.length >= 3 ? BUCKETS[classify(x, y, board)] : "—"; b[k] = (b[k] || 0) + w;

function equityVs(hero, board, v, iters = 5000){
  const base = new Uint8Array(52); hero.forEach(c => base[c] = 1); board.forEach(c => base[c] = 1);
  const idx = [], cum = []; let t = 0;
  for (let i = 0; i < v.w.length; i++){ const w = v.w[i]; if (!w) continue; const [a, b] = ALL_COMBOS[i]; if (base[a] || base[b]) continue; t += w; idx.push(i); cum.push(t); }

  hb[0] = hero[0]; hb[1] = hero[1]; for (let i = 0; i < bl; i++){ hb[2 + i] = board[i]; ob[2 + i] = board[i]; }
  let win = 0;
  for (let it = 0; it < iters; it++){
    used.set(base);
    const r = Math.random() * t; let lo = 0, hi = cum.length - 1; while (lo < hi){ const m = (lo + hi) >> 1; if (cum[m] < r) lo = m + 1; else hi = m; }
    const [a, b] = ALL_COMBOS[idx[lo]]; used[a] = used[b] = 1; ob[0] = a; ob[1] = b;
    for (let i = bl; i < 5; i++){ let c; do { c = (Math.random() * 52) | 0; } while (used[c]); used[c] = 1; hb[2 + i] = c; ob[2 + i] = c; }

  const r = Math.random() * t; let lo = 0; while (cum[lo] < r) lo++;
  return ALL_COMBOS[idx[lo]].slice();
}

function recPre(){
  const k = H.prompt.kind, code = H.code;
  if (k === "pre-open"){ const a = chartAction(code, "open", H.n, H.heroPos); return { best: [a], main: a, why: `${code} ${a === "raise" ? "está" : "não está"} no range de abertura do ${H.heroPos} numa mesa de ${H.n} (${pctI(rangePct(openSet(H.n, H.heroPos)))} das mãos).`, chart: { code, mode: "open", n: H.n, pos: H.heroPos } }; }
  if (k === "pre-vs"){ const a = chartAction(code, "vsraise", H.n, H.heroPos); return { best: [a], main: a, why: `${H.villPos} abre ~${pctI(rangePct(openSet(H.n, H.villPos)))} das mãos. Contra isso: 3-bet com TT+, AQs+, AK; call com pares e suited fortes${H.heroPos === "BB" ? " (no BB você defende bem mais, já pagou 1 big)" : ""}; fold no resto. ${code} → ${ACTS[a].toUpperCase()}.`, chart: { code, mode: "vsraise", n: H.n, pos: H.heroPos } }; }
  if (k === "pre-vs3"){ const a = VS3_4BET.has(code) ? "raise" : VS3_CALL.has(code) ? "call" : "fold"; return { best: [a], main: a, why: `Contra 3-bet o range dele é forte (TT+, AQ+, KQs e alguns blefes). 4-bet só QQ+/AK; call com 99–JJ, AQ, AJs, KQs; fold o resto. ${code} → ${ACTS[a].toUpperCase()}.` }; }
}
function heroOuts(){ const b = shown(); return b.length >= 3 && b.length < 5 ? computeOuts(H.hero, b).n : 0; }
function recPost(){
  const b = shown(), eq = equityVs(H.hero, b, H.v), info = rangeInfo(H.v, H.hero, b), tc = r2h(H.vIn - H.hIn), P = potNow();
  const wet = wetBoard(b), ip = heroIP(), outs = heroOuts(), hand = describe(evalCards([...H.hero, ...b], 2 + b.length));
  const ctx = `Seu jogo: <b>${hand}</b>${outs ? ` (${outs} outs)` : ""}. Contra o range dele você ganha <b>${pctI(eq)}</b>. Board ${wet ? "molhado" : "seco"}, você ${ip ? "em posição" : "fora de posição"}.`;
  let best, main, why;
  if (tc > 0){
    const c = Math.min(tc, hLeft()), req = c / (P + c), canR = H.prompt.opts.some(o => o[0] === "raise");
    if (eq >= 0.75 && canR){ best = ["raise", "call"]; main = "raise"; why = `Você está muito na frente (${pctI(eq)}): aumente por valor. Pagar pra enganar também serve.`; }
    else if (eq >= req + 0.03){ best = ["call"]; main = "call"; why = `Precisa de ${pctI(req)} e tem ${pctI(eq)}: pagar dá lucro.`; if (eq >= 0.65 && canR) best.push("raise"); }
    else if (eq >= req - 0.04){ best = ["call", "fold"]; main = eq >= req ? "call" : "fold"; why = `Decisão apertada: precisa de ${pctI(req)}, tem ${pctI(eq)}. As duas valem.`; }
    else if (H.street === "flop" && outs >= 8 && eq >= req - 0.09){ best = ["call", "fold"]; main = "call"; why = `Pela conta faltam ${pctI(req - eq)}, mas com ${outs} outs e stacks fundos as implied odds pagam.`; }
    else { best = ["fold"]; main = "fold"; why = `Precisa de ${pctI(req)} e tem só ${pctI(eq)}: largue.`; }
  } else {
    const valueSize = H.street === "river" && eq >= 0.78 ? ["b66", "b100"] : wet ? ["b66"] : ["b33", "b66"];
    const airShare = info.parts.filter(p => p[0].startsWith("Nada") || p[0].startsWith("Cartas altas")).reduce((s, p) => s + p[1], 0);
    if (eq >= 0.62){ best = valueSize; main = valueSize[0] === "b33" ? "b33" : valueSize[0]; why = `Você está na frente do range dele (${pctI(eq)}): aposte por valor, ${wet ? "grande (board molhado, cobre os draws)" : "pequeno (board seco, ele paga com mais coisa)"}.`; }
    else if (outs >= 8 && H.street !== "river"){ best = ip ? ["b66", "check"] : ["check", "b66"]; main = best[0]; why = `Draw forte (${outs} outs): ${ip ? "semi-blefe é bom, ganha quando ele larga e quando você acerta" : "check e decida contra a aposta; semi-blefe também vale"}.`; }
    else if (H.street === "river" && ip && airShare >= 0.45 && eq < 0.3){ best = ["check", "b66"]; main = "check"; why = `Sua mão não ganha no showdown, mas ${pctI(airShare)} do range dele é nada ou só cartas altas. Blefe vale; check também.`; }
    else if (eq >= 0.45){ best = ["check"]; if (!wet && ip) best.push("b33"); main = "check"; why = `Mão média (${pctI(eq)}): controle o pote. ${!wet && ip ? "Uma aposta pequena por valor fino também serve." : ""}`; }
    else { best = ["check"]; main = "check"; why = `Você está atrás (${pctI(eq)}): não tem valor pra apostar.`; }
  }
  return { best, main, why: `${why}<br><span class="muted">${ctx}</span>`, eq, info };
}
// ---------- Ações do herói ----------
const POST_OPTS_FACING = () => { const tc = r2h(H.vIn - H.hIn), o = [["fold", "Fold"], ["call", `Call ${money(Math.min(tc, hLeft()))}`]]; if (!H.raisedThisStreet && hLeft() > tc) { const to = Math.min(chip(H.vIn * 3), H.hStack); o.push(["raise", to >= H.hStack ? `All-in ${money(H.hStack - H.hIn)}` : `Raise ${money(to)}`]); } return o; };
const POST_OPTS_OPEN = () => { const P = potNow(), L = hLeft(); return [["check", "Check"], ["b33", `⅓ ${money(Math.min(chip(P / 3), L))}`], ["b66", `⅔ ${money(Math.min(chip(P * 2 / 3), L))}`], ["b100", `Pote ${money(Math.min(chip(P), L))}`]]; };
function heroPrompt(){
  const facing = H.vIn > H.hIn;
  H.prompt = { kind: facing ? "facing" : "open", opts: facing ? POST_OPTS_FACING() : POST_OPTS_OPEN(), text: facing ? `Ele apostou ${money(H.vIn - H.hIn)}. Pote ${money(potNow())}.` : `${H.vActed ? "Ele deu check." : "Você fala primeiro."} Pote ${money(potNow())}.` };
  H.prompt.rec = recPost();
  // pergunta de leitura de range às vezes, quando ele acabou de apostar
  if (facing && Math.random() < 0.4){
    const parts = H.prompt.rec.info.parts.filter(p => p[0] !== "—");
    if (parts.length >= 2){
      const right = parts[0][0], pool = Object.values(BUCKETS).filter((x, i, a) => a.indexOf(x) === i && x !== right);
      H.quiz = { right, opts: shuffle([right, ...shuffle(pool).slice(0, 3)]), parts };
    }
  }
}
function heroChoose(k){
  const pr = H.prompt, rec = pr.rec, ok = rec.best.includes(k);
  const label = (pr.opts.find(o => o[0] === k) || [k, k])[1];
  H.dec.push({ st: H.street, chosen: label, ok, main: (pr.opts.find(o => o[0] === rec.main) || [rec.main, rec.main])[1] });
  H.fb = { ok, chosen: label, rec, best: rec.best.map(b => (pr.opts.find(o => o[0] === b) || [b, b])[1]), apt: rec.best.length > 1 };
  scoreDec(H.street, ok);
  H.pendingAct = k;
}
function scoreDec(st, ok){
  const s = P.hs || (P.hs = { hands: 0, dec: {} }); const d = s.dec[st] || (s.dec[st] = { n: 0, ok: 0 });
  d.n++; if (ok) d.ok++;
  P.xp += ok ? 15 : 3; P.days[today()] = (P.days[today()] || 0) + 1; persist();
}
function applyHero(){
  const k = H.pendingAct; H.fb = null; H.pendingAct = null; H.quiz = null;
  const st = H.street, b = shown(), kind = H.prompt.kind;
  if (st === "pre") return applyPre(k, kind);
  if (k === "fold"){ addLog("hero", "Você largou."); return endHand("vil"); }
  if (k === "call"){ const c = Math.min(r2h(H.vIn - H.hIn), hLeft()); H.hIn = r2h(H.hIn + c); addLog("hero", `Você pagou ${money(c)}.`); return streetEnd(); }
  if (k === "check"){ addLog("hero", "Você deu check."); if (H.vActed) return streetEnd(); return villAct(); }
  // bet/raise
  const P = potNow(), to = k === "raise" ? Math.min(chip(H.vIn * 3), H.hStack) : Math.min(H.hIn + chip(k === "b33" ? P / 3 : k === "b66" ? P * 2 / 3 : P), H.hStack);
  H.hIn = to; if (k === "raise") H.raisedThisStreet = true;
  addLog("hero", `${k === "raise" ? "Você aumentou para" : "Você apostou"} ${money(k === "raise" ? to : to)}${to >= H.hStack ? " (all-in)" : ""}.`);
  return villRespond();
}
function applyPre(k, kind){
  const bb = H.bb, n = H.n;
  if (k === "fold"){ addLog("hero", "Você largou."); return endHand("vil"); }
  if (kind === "pre-open"){
    H.hIn = 3 * bb; addLog("hero", `Você aumentou para ${money(3 * bb)}.`);
    // vilão: continua com range de call ou 3-bet
    const callBase = H.villPos === "BB" ? "bbdef" : "callopen";
    const cont = mkRange(callBase, n), three = mkRange("3bet", n);
    const w3 = 0.25;
    if (Math.random() < w3){
      H.v = three; H.vill = sampleFrom(three, H.hero);
      const to = chip(H.hIn * (heroIP() ? 4 : 3)); H.vIn = to; addLog("vil", `${H.villPos} aumentou por cima para ${money(to)} (3-bet).`);
      H.prompt = { kind: "pre-vs3", opts: [["fold", "Fold"], ["call", `Call ${money(to - H.hIn)}`], ["raise", `4-bet ${money(chip(to * 2.3))}`]], text: "Ele deu 3-bet. O que você faz?" };
      H.prompt.rec = recPre(); return;
    }
    H.v = cont; H.vill = sampleFrom(cont, H.hero); H.vIn = H.hIn; addLog("vil", `${H.villPos} pagou.`);
    return toFlop();
  }
  if (kind === "pre-vs"){
    if (k === "call"){ addLog("hero", `Você pagou ${money(H.vIn - H.hIn)}.`); H.hIn = H.vIn; return toFlop(); }
    const to = chip(H.vIn * (heroIP() ? 3 : 4)); H.hIn = to; addLog("hero", `Você deu 3-bet para ${money(to)}.`);
    const vc = handCode(H.vill[0], H.vill[1]);
    if (VS3_4BET.has(vc) || BASES.call3bet.has(vc)){ H.vIn = to; H.v = mkRange("call3bet", n); addLog("vil", `${H.villPos} pagou o 3-bet.`); return toFlop(); }
    addLog("vil", `${H.villPos} largou.`); return endHand("hero");
  }
  if (kind === "pre-vs3"){
    if (k === "call"){ addLog("hero", `Você pagou ${money(H.vIn - H.hIn)}.`); H.hIn = H.vIn; return toFlop(); }
    const to = chip(H.vIn * 2.3); H.hIn = to; addLog("hero", `Você deu 4-bet para ${money(to)}.`);
    if (VS3_4BET.has(handCode(H.vill[0], H.vill[1]))){ H.vIn = to; H.v = mkRange("4bet", n); addLog("vil", `${H.villPos} pagou o 4-bet.`); return toFlop(); }
    addLog("vil", `${H.villPos} largou.`); return endHand("hero");
  }
}
function toFlop(){
  H.pot = r2h(H.pot + H.hIn + H.vIn); H.hStack = r2h(H.hStack - H.hIn); H.vStack = r2h(H.vStack - H.vIn); H.hIn = H.vIn = 0;
  H.board = deal(5, [...H.hero, ...H.vill]);
  H.street = "flop"; return streetStart();
}
function streetStart(){
  H.hIn = H.vIn = 0; H.vActed = false; H.raisedThisStreet = false; H.vRaisedStreet = false;
  addLog("board", `${SN[H.street]}: ${shown().slice(H.street === "flop" ? 0 : -1).map(c => rl(c >> 2) + SUITS[c & 3]).join(" ")}`);
  if (H.hStack <= 0 || H.vStack <= 0) return streetEnd();
  if (heroIP()) return villAct(); // vilão fala primeiro
  heroPrompt();
}
function streetEnd(){
  H.pot = r2h(H.pot + H.hIn + H.vIn); H.hStack = r2h(H.hStack - H.hIn); H.vStack = r2h(H.vStack - H.vIn); H.hIn = H.vIn = 0;
  if (H.street === "river" || H.hStack <= 0 || H.vStack <= 0){ H.street = "river"; return endHand("show"); }
  H.street = H.street === "flop" ? "turn" : "turn" === H.street ? "river" : "river";
  return streetStart();
}
// ---------- Política do vilão ----------
function vClass(){ return classify(H.vill[0], H.vill[1], shown()); }
function villAct(){
  const c = vClass(), b = shown(), wet = wetBoard(b), P = potNow(), checkedTo = H.log.some(l => l.st === H.street && l.who === "hero" && l.t.startsWith("Você deu check"));
  const pBet = { monster: 0.75, top: 0.7, pair: 0.25, draw: 0.45, weak: checkedTo ? 0.35 : 0.2, air: checkedTo ? 0.3 : 0.12 }[c];
  H.vActed = true;
  if (Math.random() < pBet && vLeft() > 0){
    const size = Math.min(chip(P * (c === "monster" && wet ? 0.75 : wet ? 0.66 : 0.33)), H.vStack);
    H.vIn = r2h(H.hIn + size); rAct(H.v, "bet", b);
    addLog("vil", `${H.villPos} apostou ${money(size)}.`);
  } else { rAct(H.v, "check", b); addLog("vil", `${H.villPos} deu check.`); if (checkedTo) return streetEnd(); }
  heroPrompt();
}
function villRespond(){
  const c = vClass(), b = shown(), bet = r2h(H.hIn - H.vIn), P = potNow() - bet, frac = bet / Math.max(P, 1);
  const allin = H.hIn >= H.hStack;
  let r = Math.random(), act;
  if (c === "monster") act = !allin && r < 0.4 && !H.vRaisedStreet ? "raise" : "call";
  else if (c === "top") act = !allin && r < 0.1 && !H.vRaisedStreet ? "raise" : "call";
  else if (c === "pair") act = frac <= 0.5 || r < 0.5 ? "call" : "fold";
  else if (c === "draw") act = !allin && r < 0.12 && H.street !== "river" && !H.vRaisedStreet ? "raise" : (frac <= 0.7 || r < 0.4) && H.street !== "river" ? "call" : "fold";
  else if (c === "weak") act = r < 0.25 && H.street !== "river" ? "call" : "fold";
  else act = r < 0.06 ? "call" : "fold";
  if (allin && act === "call" && (c === "pair" && r > 0.5 || c === "draw" && r > 0.5)) act = "fold";
  if (act === "fold"){ addLog("vil", `${H.villPos} largou.`); return endHand("hero"); }
  if (act === "call"){ const cc = Math.min(H.hIn, H.vStack); H.vIn = cc; rAct(H.v, "call", b); addLog("vil", `${H.villPos} pagou.`); return streetEnd(); }
  const to = Math.min(chip(H.hIn * 3), H.vStack); H.vIn = to; H.vRaisedStreet = true; rAct(H.v, "raise", b);
  addLog("vil", `${H.villPos} aumentou para ${money(to)}${to >= H.vStack ? " (all-in)" : ""}.`);
  H.raisedThisStreet = true; heroPrompt();
}
function endHand(w){
  if (H.board == null) H.board = deal(5, [...H.hero, ...(H.vill || [])]);
  if (!H.vill) H.vill = deal(2, [...H.hero, ...H.board]);
  const potT = r2h(H.pot + H.hIn + H.vIn);
  let res;
  if (w === "show"){
    const hs = evalCards([...H.hero, ...H.board], 7), vs = evalCards([...H.vill, ...H.board], 7);
    res = hs > vs ? "hero" : hs < vs ? "vil" : "split";
    H.showdown = { hd: describe(hs), vd: describe(vs) };
  } else res = w;
  const heroPut = r2h(H.startStack - H.hStack + H.hIn);
  H.net = res === "hero" ? r2h(potT - heroPut) : res === "split" ? r2h(potT / 2 - heroPut) : -heroPut;
  H.res = res; H.done = true; H.prompt = null;
  const s = P.hs || (P.hs = { hands: 0, dec: {} }); s.hands++; persist();
}
function quizAnswer(k){
  const q = H.quiz; q.ans = k; q.ok = k === q.right;
  const s = P.hs || (P.hs = { hands: 0, dec: {} }); const d = s.dec.range || (s.dec.range = { n: 0, ok: 0 }); d.n++; if (q.ok) d.ok++;
  P.xp += q.ok ? 8 : 2; persist();
}

// ---------- Tela ----------
function renderHand(M){
  if (!H){ M.innerHTML = `<section class="card"><h2>Jogar mãos</h2><p>O app distribui uma mão de cash e você joga até o fim contra um vilão que age de acordo com as cartas dele. Em cada decisão: o que fazer, o range dele e a sua equity.</p><button type="button" class="big gold" data-act="hnew">▶ Distribuir mão</button>${handStatsHTML()}</section>`; return; }
  const b = H.board ? (H.done ? H.board : shown()) : [];
  let h = `<section class="card"><div class="qhead"><span class="tag" style="margin:0">Mesa de ${H.n} · você ${H.heroPos} × vilão ${H.villPos}</span><span class="prog">${heroIP() ? "IP" : "OOP"}</span></div>
    <div class="felt"><div class="frow"><span class="lb">Vilão</span>${H.done && H.vill ? H.vill.map(c => cardHTML(c)).join("") : `<span class="pc back"></span><span class="pc back"></span>`}<span class="potc">pote<b>${money(H.done ? r2h(H.pot + H.hIn + H.vIn) : potNow())}</b></span></div>
      ${b.length ? `<div class="frow"><span class="lb">${H.done && !H.showdown && H.log.every(l => l.st === "pre") ? "Viria" : "Mesa"}</span>${b.map(c => cardHTML(c, true)).join("")}</div>` : ""}
      <div class="frow"><span class="lb">Você</span>${H.hero.map(c => cardHTML(c)).join("")}<span class="potc">stack<b>${money(H.done ? r2h(H.startStack + H.net) : hLeft())}</b></span></div></div>
    <ol class="hlog">${H.log.map(l => `<li class="${l.who}">${l.t}</li>`).join("")}</ol>`;
  if (H.done){
    h += `<div class="fb ${H.net >= 0 ? "ok" : "bad"}"><b>${H.res === "hero" ? "Você ganhou o pote" : H.res === "split" ? "Pote dividido" : "Você perdeu"} · ${H.net >= 0 ? "+" : "−"}${money(Math.abs(H.net))}</b>${H.showdown ? `<p>Você: ${H.showdown.hd}. Vilão: ${H.showdown.vd}.</p>` : `<p>Vilão tinha ${H.vill.map(c => rl(c >> 2) + SUITS[c & 3]).join(" ")}.</p>`}</div>
      <h3 style="margin-top:14px">Suas decisões</h3><ul class="declist">${H.dec.map(d => `<li class="${d.ok ? "ok" : "bad"}"><span>${SN[d.st]}</span><b>${d.ok ? "✓" : "✗"} ${d.chosen}</b>${d.ok ? "" : `<small>melhor: ${d.main}</small>`}</li>`).join("")}</ul>
      <button type="button" class="big gold" data-act="hnew">Próxima mão →</button>`;
    M.innerHTML = h + handStatsHTML() + `</section>`; return;
  }
  const pr = H.prompt;
  if (H.quiz && !H.quiz.ans){
    h += `<p class="qtext">Antes de decidir: o que o range dele mais tem agora?</p><div class="opts one">${H.quiz.opts.map(o => `<button type="button" class="opt" data-act="hquiz" data-k="${o}">${o}</button>`).join("")}</div>`;
    M.innerHTML = h + `</section>`; return;
  }
  if (H.quiz && H.quiz.ans){
    h += `<div class="fb ${H.quiz.ok ? "ok" : "bad"}"><b>${H.quiz.ok ? "✓ Leitura certa" : "✗ Leitura errada"}</b><p>${H.quiz.parts.slice(0, 4).map(p => `${p[0]}: <b>${pctI(p[1])}</b>`).join(" · ")}</p></div>`;
  }
  h += `<p class="qtext">${pr.text}</p>`;
  if (!H.fb){
    h += `<div class="opts ${pr.opts.length === 3 ? "three" : ""}">${pr.opts.map(([k, l]) => `<button type="button" class="opt hopt a-${k === "raise" || k.startsWith("b") ? "raise" : k}" data-act="hdec" data-k="${k}">${l}</button>`).join("")}</div>`;
  } else {
    const f = H.fb;
    h += `<div class="opts ${pr.opts.length === 3 ? "three" : ""}">${pr.opts.map(([k, l]) => `<button type="button" class="opt hopt ${f.rec.best.includes(k) ? "right" : l === f.chosen ? "wrong" : "dim"}" disabled>${l}</button>`).join("")}</div>
      <div class="fb ${f.ok ? "ok" : "bad"}"><b>${f.ok ? (f.apt ? "✓ Boa (mais de uma opção vale)" : "✓ Certo") : "✗ Não é o ideal"}</b>${f.ok ? "" : ` · melhor: ${f.best.join(" ou ")}`}<p>${f.rec.why}</p>
      ${f.rec.info ? `<div class="rinfo"><small>Range dele agora: ${pctI(f.rec.info.share)} das mãos</small>${f.rec.info.parts.filter(p => p[0] !== "—").slice(0, 5).map(p => `<div class="rbar"><span>${p[0]}</span><i><em style="width:${(p[1] * 100).toFixed(0)}%"></em></i><b>${pctI(p[1])}</b></div>`).join("")}</div>` : ""}</div>
      ${f.rec.chart ? `<button type="button" class="linkbtn" data-act="chart">${V.showChart ? "▾" : "▸"} Ver a tabela</button>${V.showChart ? chartHTML(f.rec.chart) : ""}` : ""}
      <button type="button" class="big" data-act="hgo" id="hgo">Continuar a mão →</button>`;
  }
  M.innerHTML = h + `</section>`;
  if (H.fb) requestAnimationFrame(() => { const n = $("hgo"); if (n) n.scrollIntoView({ behavior: "smooth", block: "nearest" }); });
}
function handStatsHTML(){
  const s = P.hs; if (!s || !s.hands) return "";
  const row = k => { const d = s.dec[k]; return `<li><span>${{ pre: "Pré-flop", flop: "Flop", turn: "Turn", river: "River", range: "Leitura de range" }[k]}</span><b>${d && d.n ? pctI(d.ok / d.n) : "—"}</b><small>${d ? d.ok + "/" + d.n : ""}</small></li>`; };
  return `<div class="hstats"><h3>${s.hands} mãos jogadas · acerto por rua</h3><ul>${["pre", "flop", "turn", "river", "range"].map(row).join("")}</ul></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  switch (b.dataset.act){
    case "hnew": newHand(); V.tab = "jogar"; V.showChart = false; window.scrollTo({ top: 0 }); break;
    case "hdec": heroChoose(b.dataset.k); break;
    case "hgo": applyHero(); V.showChart = false; window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "hquiz": quizAnswer(b.dataset.k); break;
    default: return;
  }
  render();
});

render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
